spring.application.name=restful-webservice
spring.jpa.hibernate.ddl-auto=update
spring.datasource.username=root
spring.datasource.password=
spring.datasource.url=jdbc:mysql://192.168.23.47:3306/user_management

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL8Dialect

management.endpoints.web.exposure.include=*
management.info.env.enabled=true
management.endpoint.health.show-details=always
management.endpoint.env.show-values=always
management.endpoint.configprops.show-values=when_authorized
management.endpoint.shutdown.enabled=true

info.app.name=Spring Boot Restful Web Service
info.app.description=Spring Boot Restful Web Services Demo
info.app.version=1.0.0
info.hello.gavin=true

